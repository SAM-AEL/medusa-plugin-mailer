<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ .Subject }}</title>
  <style>
    body,table,td,a{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;}
    body{margin:0!important;padding:0!important;width:100%!important;background:#ffffff!important;}
    img{border:0;outline:none;text-decoration:none;}
    @media only screen and (max-width:620px){
      .wrap{width:100%!important;}
      .px{padding-left:20px!important;padding-right:20px!important;}
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#111827;">
  <div style="display:none;max-height:0;overflow:hidden;">Store credit · {{ .StoreName }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
    <tr><td align="center" style="padding:0;background:#ffffff;">
      <table role="presentation" class="wrap" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;background:#ffffff;">
        <tr>
          <td class="px" style="padding:40px 32px 24px;background:#ffffff;">
            <!-- Optional logo (set MAILER_LOGO_URL). Store name is always shown as brand fallback. -->
            <a href="{{ .SiteURL }}" style="text-decoration:none;color:#111827;display:inline-block;">
              <img src="{{ .LogoURL }}" alt="" width="120" style="display:block;max-height:36px;width:auto;border:0;margin:0 0 10px 0;" />
              <span style="font-size:17px;font-weight:600;letter-spacing:-0.02em;color:#111827;">{{ .StoreName }}</span>
            </a>
          </td>
        </tr>
        <tr>
          <td class="px" style="padding:0 32px;background:#ffffff;">
            <div style="height:1px;background:#f3f4f6;line-height:1px;font-size:0;">&nbsp;</div>
          </td>
        </tr>
        <tr>
          <td class="px" style="padding:28px 32px 36px;background:#ffffff;">
            <p style="margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:#9ca3af;">Store credit</p>
            <h1 style="margin:0 0 16px;font-size:24px;font-weight:600;line-height:1.3;color:#111827;letter-spacing:-0.02em;">Store credit added</h1>
            <div style="font-size:15px;line-height:1.65;color:#4b5563;">
              <p style="margin:0 0 14px;">Hi {{ .first_name }},</p><p style="margin:0 0 14px;">Store credit was added to your wallet.</p><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:12px 0 20px;border:1px solid #f3f4f6;border-radius:10px;"><tr><td style="padding:16px 18px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
  <td style="padding:0 0 10px;font-size:13px;color:#9ca3af;">Credited</td>
  <td align="right" style="padding:0 0 10px;font-size:14px;font-weight:600;color:#111827;">{{ .amount }}</td>
</tr><tr>
  <td style="padding:10px 0 10px;font-size:13px;color:#9ca3af;border-top:1px solid #f3f4f6;">Balance</td>
  <td align="right" style="padding:10px 0 10px;font-size:14px;font-weight:600;color:#111827;border-top:1px solid #f3f4f6;">{{ .balance }}</td>
</tr><tr>
  <td style="padding:10px 0 0;font-size:13px;color:#9ca3af;border-top:1px solid #f3f4f6;">Note</td>
  <td align="right" style="padding:10px 0 0;font-size:14px;font-weight:600;color:#111827;border-top:1px solid #f3f4f6;">{{ .description }}</td>
</tr></table></td></tr></table>
            </div>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:32px;"><tr>
<td style="border-radius:8px;background:#111827;"><a href="{{ .SiteURL }}" style="display:inline-block;padding:12px 22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;color:#ffffff !important;text-decoration:none;border-radius:8px;">Shop now</a></td>
</tr></table>
          </td>
        </tr>
        <tr>
          <td class="px" style="padding:0 32px 40px;background:#ffffff;">
            <div style="height:1px;background:#f3f4f6;line-height:1px;font-size:0;margin-bottom:20px;">&nbsp;</div>
            <p style="margin:0;font-size:12px;line-height:1.5;color:#9ca3af;">
              &copy; {{ .StoreName }}
              <span style="color:#e5e7eb;"> · </span>
              {{ .RecipientEmail }}
            </p>
            <p style="margin:12px 0 0;font-size:12px;color:#9ca3af;">Ref: {{ .reference_id }}</p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
